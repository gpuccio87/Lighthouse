; Lighthouse - example configuration
; Copy this file to Lighthouse.ini next to Lighthouse.exe (or let the first run create one for you).
; Each [section] is one menu entry. After editing: menu > "Ricarica configurazione" (Reload configuration).
;
; [general]
;   rclone       = path of rclone.exe
;   rcloneconfig = rclone.conf passed to rclone as --config (detected by the import)
;   autorestart  = 1 to restart crashed entries automatically (up to 5 attempts, growing delay)
;   rcpass       = rclone remote-control password; generated on the first run, leave it out here
;
; rclone mounts (no "exe" key):
;   args      = rclone arguments (without "rclone.exe"); Lighthouse adds --rc and --log-file itself
;   drive     = drive letter (taken from args if omitted)
;   port      = local rc port used to control the mount (a different one for each mount)
;
; Other programs ("exe" key): the real executable, not a shortcut or a .bat that launches something else
;   exe       = full path of the executable
;   args      = arguments (optional)
;   workdir   = working directory (optional, default: the exe's folder)
;
; All entries:
;   autostart = 1 to start it when Lighthouse starts, 0 to leave it stopped

[general]
rclone=C:\rclone\rclone.exe
rcloneconfig=%APPDATA%\rclone\rclone.conf
autorestart=1

[GoogleDrive]
args=mount gdrive: G: -o volname="Google Drive" --vfs-cache-mode=full
port=5581
autostart=1

[Backup]
args=mount backup-crypt: B: -o volname="Backup" --vfs-cache-mode=full
port=5582
autostart=1

[AutoHotkey]
exe=C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe
args="C:\Scripts\Startup.ahk"
workdir=C:\Scripts
autostart=1

[RealTimeSync]
exe=C:\Program Files\FreeFileSync\Bin\RealTimeSync_x64.exe
args="C:\FreeFileSync\Documents.ffs_real"
workdir=C:\FreeFileSync
autostart=1
